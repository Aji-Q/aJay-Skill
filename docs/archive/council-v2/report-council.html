<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="author" content="aJay"><title>{{PAGE_TITLE}}</title><style>/* INJECT_COUNCIL_CSS */</style></head>
<body>
<a href="#question" class="skip-link">跳到当前研究问题</a>
<div class="decision-room" id="decision-room">
  <div class="room-environment" aria-hidden="true"><img id="scene-back" alt=""><img id="scene-front" alt=""></div>
  <header class="masthead"><a href="#" class="brand" aria-label="aJay 私人研究室"><b>aJay</b><span>PRIVATE RESEARCH</span></a><div class="security-label"><span id="security-ticker"></span><strong id="security-name"></strong><small id="sample-label"></small></div><button class="text-button" data-open-dossier="all">研究底稿 <span data-icon="file-text"></span></button></header>
  <div class="place-line"><nav id="city-nav" class="city-nav" aria-label="切换金融中心场景"></nav><div class="room-coordinate"><span id="room-location"></span><button class="scene-explore" id="explore-scene">展开场景 <span data-icon="arrow-up-right"></span></button></div></div>
  <main class="council-stage">
    <section class="briefing" aria-labelledby="question">
      <div class="briefing-eyebrow"><span>THE INVESTMENT COUNCIL</span><span id="topic-count">01 / 03</span></div>
      <nav class="agenda" id="agenda" aria-label="研究议题"></nav>
      <h1 id="question"></h1>
      <div class="current-voice"><span class="hairline"></span><span id="speaker-method"></span><span class="voice-status">模拟视角</span></div>
      <p class="speaker-claim" id="speaker-claim"></p>
      <div class="briefing-facts" id="briefing-facts" aria-label="当前观点的关键输入"></div>
      <div class="evidence-actions"><button class="primary-button" id="view-evidence">检验证据 <span data-icon="arrow-up-right"></span></button><button class="text-button" id="next-perspective">换一种视角 <span data-icon="arrow-right"></span></button></div>
      <div class="counterpoint"><div class="counterpoint-heading"><span>COUNTERPOINT</span><span>反方追问</span></div><p id="speaker-rebuttal"></p><button class="counterpoint-link" id="test-counterpoint">查看反证与缺口 <span data-icon="arrow-up-right"></span></button></div>
    </section>
    <figure class="speaker-presence"><div class="portrait-mat"><img id="speaker-photo" alt=""></div><figcaption><span id="speaker-era"></span><h2 id="speaker-english"></h2><span id="speaker-chinese"></span></figcaption><div class="portrait-edition">AJAY / PERSPECTIVE SERIES</div></figure>
  </main>
  <section class="council-floor" aria-label="选择投资方法视角"><div class="floor-label"><span>EIGHT MINDS.</span><strong>One question.</strong><small>古今方法，同题审视</small></div><div class="perspective-rail" id="perspective-rail"></div><button class="rail-next" id="rail-next" aria-label="下一位方法视角"><span data-icon="arrow-right"></span></button></section>
  <footer class="room-footer"><span>专为 aJay / Aji-Q · 研究分非胜率</span><button id="open-disclosure">AI 肖像与观点均为模拟，非本人发言或背书 <span data-icon="plus"></span></button><span id="snapshot-date"></span></footer>
</div>
<dialog class="dossier" id="dossier" aria-labelledby="dossier-title"><div class="dossier-shell"><header class="dossier-head"><div><span class="eyebrow">AJAY / RESEARCH FILE</span><h2 id="dossier-title">研究底稿</h2></div><button class="icon-button" id="close-dossier" aria-label="关闭研究底稿"><span data-icon="x"></span></button></header><nav class="dossier-tabs" aria-label="底稿分类"><button data-dossier-tab="evidence" aria-pressed="true">证据与缺口</button><button data-dossier-tab="models" aria-pressed="false">模型与规则</button><button data-dossier-tab="about" aria-pressed="false">方法与归属</button></nav><div class="dossier-context" id="dossier-context"></div><div class="dossier-content" id="dossier-content"></div><footer class="dossier-foot"><button class="text-button" id="download-inputs">下载原始输入 <span data-icon="file-text"></span></button><span>只在本地处理 · 不自动上传</span></footer></div></dialog>
<dialog class="scene-lightbox" id="scene-lightbox" aria-labelledby="scene-title"><header class="scene-head"><div><span class="eyebrow">AJAY / FINANCIAL GEOGRAPHIES</span><h2 id="scene-title"></h2></div><button class="icon-button" id="close-scene" aria-label="返回研究会议"><span data-icon="x"></span></button></header><figure><img id="scene-detail" alt=""></figure><footer class="scene-credit"><p id="scene-credit"></p><a id="scene-source" target="_blank" rel="noopener noreferrer">原始摄影作品</a><a id="scene-license" target="_blank" rel="noopener noreferrer">影像许可</a></footer></dialog>
<div id="announcer" class="sr-only" aria-live="polite"></div>
<script id="council-data" type="application/json">/* INJECT_COUNCIL_DATA */</script>
<script>/* INJECT_GSAP */</script>
<script>/* INJECT_COUNCIL_JS */</script>
</body></html>
